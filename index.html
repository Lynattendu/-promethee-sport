<!DOCTYPE html>
<html lang="fr">
<style>
  .carte-container {
    width: 140px;
    height: 210px;
    display: inline-block;
    margin: 8px;
    perspective: 1000px;
  }

  .carte-flip {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s;
  }

  .carte-flip.retournee {
    transform: rotateY(180deg);
  }

  .carte-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    object-fit: cover;
  }

  .carte-face-avant {
    transform: rotateY(180deg);
  }
</style>



  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prométhée Jeu Sport</title>
</head>

<body>

  <!-- ÉCRAN D'ACCUEIL -->
  <div id="accueil">

    <h1>🔥 PROMÉTHÉE JEU SPORT</h1>

    <p>Choisis ton mode de jeu</p>

    <button onclick="ouvrirSolo()">
      🏋️ JEU SOLO
    </button>

    <button>
      👥 JEU À PLUSIEURS
    </button>

  </div>


  <!-- ÉCRAN SOLO -->
  <div id="solo" style="display:none;">

    <h1>🏋️ ENTRAÎNEMENT SOLO</h1>

    <p>Choisis une famille</p>

    <button onclick="ouvrirFamille('⚡ CORPS COMPLET')">
  ⚡ Corps complet
</button>

<button onclick="ouvrirFamille('🦵 JAMBES')">
  🦵 Jambes
</button>

<button onclick="ouvrirFamille('💪 BRAS')">
  💪 Bras
</button>
    
<button onclick="ouvrirFamille('🔥 ABDOS')">
  🔥 Abdos
</button>
    
<button onclick="ouvrirFamille('🍑 FESSIERS')">
  🍑 Fessiers
</button>

<button onclick="ouvrirFamille('🛡️ DOS')">
  🛡️ Dos
</button>

<button onclick="ouvrirFamille('🌈 TOUTES LES FAMILLES')">
  🌈 Toutes les familles
</button>

    <br><br>

    <button onclick="retourAccueil()">
      ← Retour
    </button>

  </div>
<!-- ÉCRAN CHOIX ENTRAÎNEMENT -->
<div id="choixEntrainement" style="display:none;">

  <h1 id="titreFamille"></h1>

  <p>Choisis ton entraînement</p>

  <button>
    🎲 ENTRAÎNEMENT HASARD
  </button>

  <button onclick="ouvrirCircuit()">
  🔄 ENTRAÎNEMENT CIRCUIT
</button>

  <br><br>

  <button onclick="retourSolo()">
    ← Retour
  </button>

</div>

<!-- ÉCRAN CIRCUIT -->
<div id="circuit" style="display:none;">

  <h1>🔥 CIRCUIT</h1>

  <p id="titreCircuit"></p>

  <p>Combien d'exercices veux-tu ?</p>

  <button onclick="choisirCircuit(3)">
    3 EXERCICES
  </button>

  <button onclick="choisirCircuit(5)">
    5 EXERCICES
  </button>

  <br><br>

  <button onclick="retourChoixEntrainement()">
    ← Retour
  </button>

</div>

<!-- ÉCRAN CARTES DU CIRCUIT -->
<div id="cartesCircuit" style="display:none;">

  <h1>🔥 TON CIRCUIT</h1>

  <p id="infoCircuit"></p>

  <div id="zoneCartes"></div>

  <br>

  <button onclick="retourCircuit()">
    ← Retour
  </button>

</div>



  

  
  
  <script>

    function ouvrirSolo() {
      document.getElementById("accueil").style.display = "none";
      document.getElementById("solo").style.display = "block";
    }

    function retourAccueil() {
      document.getElementById("solo").style.display = "none";
      document.getElementById("accueil").style.display = "block";
    }

let familleChoisie = "";

function ouvrirFamille(famille) {
  familleChoisie = famille;

  document.getElementById("solo").style.display = "none";
  document.getElementById("choixEntrainement").style.display = "block";

  document.getElementById("titreFamille").textContent = famille;
}

function retourSolo() {
  document.getElementById("choixEntrainement").style.display = "none";
  document.getElementById("solo").style.display = "block";
}

    let nombreExercicesCircuit = 0;

function ouvrirCircuit() {
  document.getElementById("choixEntrainement").style.display = "none";
  document.getElementById("circuit").style.display = "block";

  document.getElementById("titreCircuit").textContent = familleChoisie;
}

function choisirCircuit(nombre) {

  nombreExercicesCircuit = nombre;

  document.getElementById("circuit").style.display = "none";
  document.getElementById("cartesCircuit").style.display = "block";

  document.getElementById("infoCircuit").textContent =
    familleChoisie + " • " + nombre + " exercices";

  let imageDos = "";

  if (familleChoisie === "⚡ CORPS COMPLET") {
    imageDos = "images/Dos/dos-corps-complet.PNG";
  }

  if (familleChoisie === "🦵 JAMBES") {
    imageDos = "images/Dos/dos-jambes.PNG";
  }

  if (familleChoisie === "💪 BRAS") {
    imageDos = "images/Dos/dos-bras.PNG";
  }

  if (familleChoisie === "🍑 FESSIERS") {
    imageDos = "images/Dos/dos-fessiers.PNG";
  }

  if (familleChoisie === "🔥 ABDOS") {
    imageDos = "images/Dos/dos-abdos.PNG";
  }

  if (familleChoisie === "🛡️ DOS") {
    imageDos = "images/Dos/dos-dos.PNG";
  }

  if (familleChoisie === "🌈 TOUTES LES FAMILLES") {
    imageDos = "images/Dos/dos-toutes-familles.PNG";
  }

  let zone = document.getElementById("zoneCartes");
  zone.innerHTML = "";

  const cartesParFamille = {

  "🍑 FESSIERS": [
    "images/Cartes/fessiers-01.PNG",
    "images/Cartes/fessiers-02.PNG",
    "images/Cartes/fessiers-03.PNG",
    "images/Cartes/fessiers-04.PNG",
    "images/Cartes/fessiers-05.PNG",
    "images/Cartes/fessiers-06.PNG",
    "images/Cartes/fessiers-07.PNG",
    "images/Cartes/fessiers-08.PNG",
    "images/Cartes/fessiers-09.PNG",
    "images/Cartes/fessiers-10.PNG",
    "images/Cartes/fessiers-11.PNG",
    "images/Cartes/fessiers-12.PNG"
  ],

  "🦵 JAMBES": [],

  "💪 BRAS": [],

  "🔥 ABDOS": [],

  "🛡️ DOS": [],

  "⚡ CORPS COMPLET": []

};

  let cartesDisponibles = [];

if (familleChoisie === "🌈 TOUTES LES FAMILLES") {

  cartesDisponibles = Object.values(cartesParFamille).flat();

} else {

  cartesDisponibles = [...cartesParFamille[familleChoisie]];

}

cartesDisponibles.sort(() => Math.random() - 0.5);
  

  for (let i = 0; i < nombre; i++) {

  let container = document.createElement("div");
  container.className = "carte-container";

  let flip = document.createElement("div");
  flip.className = "carte-flip";

  let dos = document.createElement("img");
  dos.src = imageDos;
  dos.className = "carte-face";
  dos.alt = "Dos de carte";

  let avant = document.createElement("img");
  avant.className = "carte-face carte-face-avant";
  avant.alt = "Carte exercice";

  avant.src = cartesDisponibles[i];

  // On place le dos et la face dans la carte
  flip.appendChild(dos);
  flip.appendChild(avant);

  // On place la carte dans son emplacement
  container.appendChild(flip);

  // Quand on touche la carte, elle se retourne
  container.onclick = function() {

    if (!flip.classList.contains("retournee")) {
      flip.classList.add("retournee");
    }

  };

  // On affiche la carte
  zone.appendChild(container);
}

}

function retourChoixEntrainement() {
  document.getElementById("circuit").style.display = "none";
  document.getElementById("choixEntrainement").style.display = "block";
}

function retourCircuit() {
  document.getElementById("cartesCircuit").style.display = "none";
  document.getElementById("circuit").style.display = "block";
}

    
    
  </script>

</body>

</html>
