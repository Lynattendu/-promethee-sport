<style>
  .carte-container {
    width: 140px;
    height: 210px;
    display: inline-block;
    margin: 8px;
    perspective: 1000px;
  }

  .carte-flip {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s;
  }

  .carte-flip.retournee {
    transform: rotateY(180deg);
  }

  .carte-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    object-fit: cover;
  }

  .carte-face-avant {
    transform: rotateY(180deg);
  }
</style>
